name: watch-internships

on:
  # The real 30-minute clock is an external scheduler calling
  # workflow_dispatch (see README, "Reliable 30-minute runs"). GitHub's own
  # cron is best-effort and was firing every 3-7 hours, so it is kept only as
  # a fallback in case the external one stops.
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'      # fallback
    - cron: '0 12 * * SUN'      # weekly heartbeat

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # A queued run starts after the previous one has pushed its state, but
      # the default checkout is the commit that existed when the run was
      # *triggered*. Check out the branch tip instead, or the run re-alerts
      # everything the previous run just sent.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # watch.py exits non-zero when a source fails, but any source that DID
      # succeed has already written its state. That state must be committed
      # even on failure, otherwise the next run re-notifies everything it
      # already told us about.
      - name: Check for new listings
        id: check
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: Weekly heartbeat
        if: github.event.schedule == '0 12 * * SUN'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          SUMMARY=$(python3 -c "
          import json
          d = json.load(open('state.json'))
          s = d.get('seen') or d.get('sources') or {}
          print(', '.join(f'{k}: {len(v)}' for k, v in sorted(s.items())))
          ")
          curl -s -H "Priority: min" -H "Tags: heartbeat" \
            -d "Watcher alive. Tracking $SUMMARY." \
            "ntfy.sh/$NTFY_TOPIC"

      - name: Save state
        if: always()
        run: |
          git config user.name  "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add state.json digest.md
          git diff --staged --quiet && exit 0
          # If another run pushed first, git can't rebase these generated
          # files (it conflicts on digest.md). Instead take the pushed state,
          # merge ours into it key by key (merge_state.py), keep our digest,
          # and try again.
          T="$RUNNER_TEMP"
          cp state.json "$T/ours.json"; cp digest.md "$T/ours.md"
          cp merge_state.py "$T/merge_state.py"
          for i in 1 2 3 4 5; do
            git commit -qm "state $(date -u +%F_%H:%M)"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 5 + 2))
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
            python3 "$T/merge_state.py" state.json "$T/ours.json"
            cp "$T/ours.md" digest.md
            git add state.json digest.md
            git diff --staged --quiet && exit 0
          done
          exit 1

      # Surface a source failure as a red run, but only after state is safe.
      - name: Propagate source failure
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::one or more sources failed - see the check step log"
          exit 1