name: watch-internships

on:
  schedule:
    - cron: '*/30 * * * *'      # check every 30 min
    - cron: '0 12 * * SUN'      # weekly heartbeat
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: Weekly heartbeat
        if: github.event.schedule == '0 12 * * SUN'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.load(open('state.json'))))")
          curl -s -H "Priority: min" -H "Tags: heartbeat" \
            -d "Watcher alive. Tracking $COUNT listings." \
            "ntfy.sh/$NTFY_TOPIC"

      - name: Save state
        run: |
          git config user.name  "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state $(date -u +%F_%H:%M)"
          git push
